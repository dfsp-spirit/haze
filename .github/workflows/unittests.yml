name: R Unit Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['release']

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RGL_USE_NULL: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R package dependencies
        run: |
          install.packages(c(
            "remotes",
            "Rcpp",
            "RcppEigen",
            "testthat",
            "rgl",
            "freesurferformats",
            "fsbrain",
            "rmarkdown",
            "devtools"
          ))
        shell: Rscript {0}

      - name: Install special Rvcg fork (smooth_pervertex_data branch)
        run: |
          remotes::install_github("dfsp-spirit/Rvcg", ref = "smooth_pervertex_data")
        shell: Rscript {0}

      - name: Install haze
        run: |
          remotes::install_local(".", dependencies = FALSE)
        shell: Rscript {0}

      - name: Run unit tests
        run: |
          devtools::test()
        shell: Rscript {0}
